# PES 6 Game Physics Mod config
# Formato: key=value
# Valores permitidos para pesos/magnetismo: 0..999
#
# overall_ball_weight:
#   Valor base/vanilla. Se aplica fuera de conduccion, y durante acciones
#   protegidas como centros, tiros, Q+W/pase alto o saques de arquero.
#
# ball_weight_state_1:
#   Valor usado cuando ball+84 == 1.
#
# ball_weight_normal_dribble:
#   Valor usado cuando ball+84 == 0 y no hay R1/R2.
#
# ball_weight_r1:
#   Valor usado cuando ball+84 == 0 y se corre con R1 (E).
#
# ball_weight_r2:
#   Valor usado cuando ball+84 == 0 y se conduce/controla con R2 (C).
#
# ball_weight_r1_r2:
#   Valor usado cuando ball+84 == 0 y R1 + R2 estan activos.
#
# protected_action_latch_ms:
#   Ventana en ms para mantener overall despues de detectar centro/tiro/saque.



overall_ball_weight=188
ball_weight_state_1=198
ball_weight_normal_dribble=188
ball_weight_r1=305
ball_weight_r2=230
ball_weight_r1_r2=188
protected_action_latch_ms=700

# Ventana breve para R1+R2.
# Durante esta ventana, R1+R2 usa ball_weight_r1_r2.
# Luego vuelve a ball_weight_r1 si R1 sigue presionado.
protected_action_latch_ms=0
r2_charge_window_ms=600
r2_charge_start_dist_max=400
r2_charge_keep_dist_max=700